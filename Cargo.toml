[workspace]
members = [
    "crates/config",
    "crates/rule",
    "crates/dns",
    "crates/proxy",
    "crates/sysproxy",
    "crates/geoip",
    "crates/subscribe",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.10"
maxminddb = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
hex = "0.4"
webpki-roots = "0.26"
clap = { version = "4", features = ["derive"] }
dirs = "6"
unicode-width = "0.2"
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
trivial_numeric_casts = "warn"
non_ascii_idents = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Protocol/platform casts are reviewed by API-9; the pedantic cast lints are
# too noisy for length-prefixed wire formats.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Crate-qualified type names (`relay::Policy`) are preferred over repetition.
module_name_repetitions = "allow"
# Command enums and small owned arguments are passed by value at call sites;
# borrowing them adds noise without avoiding an allocation.
needless_pass_by_value = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[package]
name = "clashx-rs"
version.workspace = true
edition.workspace = true

[dependencies]
clashx-rs-config = { path = "crates/config" }
clashx-rs-rule = { path = "crates/rule" }
clashx-rs-dns = { path = "crates/dns" }
clashx-rs-geoip = { path = "crates/geoip" }
clashx-rs-proxy = { path = "crates/proxy" }
clashx-rs-sysproxy = { path = "crates/sysproxy" }
clashx-rs-subscribe = { path = "crates/subscribe" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
rustls.workspace = true
clap.workspace = true
dirs.workspace = true
anyhow.workspace = true
unicode-width.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
